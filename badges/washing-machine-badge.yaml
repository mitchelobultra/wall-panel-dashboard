type: custom:badge-horizontal-container-card
card_mod:
  style: |
    :host {
      display: flex !important;
      align-items: center !important;
      height: 100% !important;
    }
    #root {
      display: flex !important;
      align-items: center !important;
    }
badges:
  - type: custom:hui-entity-badge
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.washing_machine_current_status
    icon: mdi:washing-machine
    show_entity_picture: false
    state_content:
      - state
      - last_updated
    card_mod:
      style:
        ha-badge $: |
          /* 1. Expand the badge shape */
          .badge {
            height: 60px !important;
            border-radius: 15px !important;
            padding: 0 10px !important;
          }

          /* 2. Scale the icon */
          .icon {
            width: 32px !important;
            height: 32px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
          }
        .: |
          :host {
            --mdc-icon-size: 32px !important;
            --ha-badge-icon-size: 32px !important;

            /* Sizing controls for the promoted State (Label) and Last Updated (Value) */
            --ha-badge-label-font-size: 17px !important;
            --ha-badge-font-size: 13px !important;
          }

          {% if is_state('switch.washing_machine_power', 'off') %}
            /*
              Both animations below only ever touch `transform` and
              `opacity`. Those are the two properties every browser -
              including weak/old WebKit engines like a Tizen smart-fridge
              browser - can animate purely on the compositor thread, with
              no main-thread layout or repaint per frame. That's what
              actually matters for low-power devices, far more than any
              GPU-layer-promotion trickery (3D transforms, translateZ
              hacks, backface-visibility, etc.), which just spends extra
              GPU memory a constrained device may not have to spare.
              Keeping it to plain 2D rotate()/translate()/opacity is both
              cheaper and more compatible.
            */
            @keyframes rockDecay {
              0% {
                transform: rotate(0deg);
                animation-timing-function: ease-out;
              }
              8% {
                transform: rotate(-15deg);
                animation-timing-function: ease-in-out;
              }
              24% {
                transform: rotate(10deg);
                animation-timing-function: ease-in-out;
              }
              40% {
                transform: rotate(-6deg);
                animation-timing-function: ease-in-out;
              }
              56% {
                transform: rotate(3deg);
                animation-timing-function: ease-in-out;
              }
              64%, 100% {
                transform: rotate(0deg);
              }
            }

            /*
              Replaces the old 5-layer box-shadow "bubbles" animation.
              Animating box-shadow can never run on the compositor - the
              browser has to recompute and repaint it on the main thread
              on every single frame, and doing that for 5 shadow layers at
              once is real CPU work. On a phone or tablet that's a battery
              drain; on a fridge SoC it's a dropped-frames stutter. Two
              small real elements faded/moved with opacity + transform give
              the same "rising bubbles" read for a fraction of the cost.
            */
            @keyframes floatBubble {
              0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
              15% { opacity: 0.8; }
              70% { opacity: 0; }
              100% { opacity: 0; transform: translate(-20px, -14px) scale(1); }
            }

            ha-state-icon {
              --mdc-icon-size: 32px !important;
              animation: rockDecay 3.5s infinite;
              transform-origin: bottom center !important;
              position: relative;
              color: var(--state-active-color) !important;
              will-change: transform;
            }

            ha-state-icon::before,
            ha-state-icon::after {
              content: '';
              position: absolute;
              top: 0px;
              left: 50%;
              width: 5px;
              height: 5px;
              background-color: rgba(100, 181, 246, 0.8);
              border-radius: 50%;
              pointer-events: none;
              opacity: 0;
              animation: floatBubble 3.5s linear infinite;
              will-change: transform, opacity;
            }

            ha-state-icon::after {
              /* Second bubble reuses the same keyframes, mirrored and
                 offset in time, instead of defining a second animation -
                 keeps the CSS payload (and re-parse cost on every card_mod
                 template re-render) smaller. */
              animation-delay: -1.75s;
              transform: scaleX(-1);
            }

            /* Respect the OS/browser-level reduced-motion preference so
               anyone (or any device) that has turned it on for battery or
               comfort reasons gets a static icon instead of paying for
               the animation at all. */
            @media (prefers-reduced-motion: reduce) {
              ha-state-icon,
              ha-state-icon::before,
              ha-state-icon::after {
                animation: none !important;
              }
            }
          {% else %}
            ha-state-icon {
              --mdc-icon-size: 32px !important;
              color: gray !important;
            }
          {% endif %}
badges_align: left
badges_wrap: scroll
grid_options:
  columns: 27
  rows: auto
